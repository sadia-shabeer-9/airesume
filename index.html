<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career & Resume Tailorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-3xl mx-auto px-4 py-12 w-full">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">AI Career & Resume Tailorer</h1>
            <p class="text-slate-600 mt-2">Optimize your professional profile for specific job descriptions.</p>
        </header>

        <main class="bg-white shadow-xl rounded-2xl p-6 md:p-8 border border-slate-100">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Job Description or Role Title</label>
                    <textarea id="jobDesc" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="e.g., Seeking a registered nurse with clinical experience..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Current Skills & Experience</label>
                    <textarea id="userSkills" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="e.g., Nursing student, clinical rotations, patient care..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Target Industry</label>
                    <input type="text" id="targetIndustry" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="e.g., Healthcare, Nursing">
                </div>
                <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 cursor-pointer">
                    Generate Tailored Materials
                </button>
            </div>

            <!-- Result Box -->
            <div id="resultContainer" class="mt-8 hidden">
                <h2 class="text-lg font-bold text-slate-900 mb-3">Generated Results</h2>
                <div id="result" class="bg-slate-50 border border-slate-200 rounded-lg p-5 text-sm whitespace-pre-wrap leading-relaxed text-slate-700"></div>
            </div>
        </main>
    </div>

    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-200 bg-white">
        Designed and Developed by <span class="font-semibold text-slate-700">Sadia Shabeer</span>
    </footer>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const jobDesc = document.getElementById('jobDesc').value.trim();
            const userSkills = document.getElementById('userSkills').value.trim();
            const targetIndustry = document.getElementById('targetIndustry').value.trim();
            const btn = document.getElementById('generateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultDiv = document.getElementById('result');

            if (!jobDesc || !userSkills) {
                alert("Please fill in both the job description and your skills.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Analyzing and generating...";
            resultContainer.classList.remove('hidden');
            resultDiv.innerText = "Processing request with AI engine. Please wait...";

            try {
                const response = await fetch('/api/tailor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobDesc, userSkills, targetIndustry })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerText = data.result;
                } else {
                    resultDiv.innerText = "Backend Error: " + (data.error || "Failed to generate.");
                    alert("Backend Error: " + (data.error || "Unknown server error."));
                }
            } catch (error) {
                resultDiv.innerText = "Network Error: Could not connect to the backend server.";
                alert("Network Error: Make sure Vercel is fully deployed and the API route exists.");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Tailored Materials";
            }
        });
    </script>
</body>
</html>
